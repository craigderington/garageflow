# GarageFlow vhost for the host's Apache (apache2 on Debian).
#
# Install to /etc/apache2/sites-available/garageflow.studio.conf and enable with
# `a2ensite garageflow.studio`. Required modules:
#
#   a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite
#
# Apache terminates TLS here and proxies to the compose stack over loopback.
# The stack publishes 127.0.0.1:28300 (web) and 127.0.0.1:28301 (api) — not the
# usual 3000/8080, because this server hosts several applications. Keep these
# in sync with WEB_PORT / API_PORT in .env.

<VirtualHost *:80>
    ServerName garageflow.studio
    ServerAlias www.garageflow.studio

    # ACME http-01 must never be redirected, or renewals fail. This wins over
    # the rewrite below because RewriteCond exempts it explicitly.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://garageflow.studio$1 [R=301,L]

    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    ServerName garageflow.studio
    ServerAlias www.garageflow.studio

    SSLEngine On
    # Read straight from certbot's live directory: a renewal then needs only an
    # Apache reload, with no copy step to forget and no stale duplicate.
    SSLCertificateFile /etc/letsencrypt/live/garageflow.studio/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/garageflow.studio/privkey.pem

    # TLS 1.2 is kept on purpose. DVI links get opened on whatever phone the
    # customer happens to own, and 1.3-only would exclude Android 9 and earlier
    # and iOS before 12.2.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLHonorCipherOrder off

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # DVI photo uploads stream through the API; don't cut off a slow phone.
    ProxyTimeout 120

    # WebSockets first — ProxyPass matches in order, so this must precede the
    # /api/ rule or the upgrade handshake gets proxied as plain HTTP and fails.
    # The API serves /ws at its root; the browser reaches it via /api/ws.
    ProxyPass        /api/ws ws://127.0.0.1:28301/ws
    ProxyPassReverse /api/ws ws://127.0.0.1:28301/ws

    # /api/* -> the Go API with the prefix stripped. The browser calls
    # https://garageflow.studio/api/auth/me; the API sees /auth/me.
    ProxyPass        /api/ http://127.0.0.1:28301/
    ProxyPassReverse /api/ http://127.0.0.1:28301/

    # Everything else -> Next.js, including the marketing landing at /.
    ProxyPass        / http://127.0.0.1:28300/
    ProxyPassReverse / http://127.0.0.1:28300/

    ErrorLog  ${APACHE_LOG_DIR}/garageflow.studio-error.log
    CustomLog ${APACHE_LOG_DIR}/garageflow.studio-access.log combined
</VirtualHost>
