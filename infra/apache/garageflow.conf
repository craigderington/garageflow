# GarageFlow vhosts for the shared Curalis Apache proxy (carehaus-proxy-1).
#
# This file is bind-mounted into the proxy container and pulled in with
# IncludeOptional, so GarageFlow owns its own routing without its config living
# in the Curalis repo.
#
# Do NOT add a `Listen` directive here — curalis.conf already declares
# `Listen 443`, and a duplicate aborts httpd startup.
#
# Backends are reached through mod_rewrite's [P] flag rather than ProxyPass on
# purpose. Apache resolves ProxyPass hostnames when it parses the config, so a
# stopped gf-web/gf-api would make httpd fail to start and take Curalis down
# with it. [P] resolves per request: if GarageFlow is down its vhost returns
# 502 and Curalis keeps serving.

<VirtualHost *:80>
    ServerName garageflow.studio
    ServerAlias www.garageflow.studio

    RewriteEngine On
    RewriteRule ^(.*)$ https://garageflow.studio$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName garageflow.studio
    ServerAlias www.garageflow.studio

    SSLEngine On
    # Straight from certbot's live directory so renewals need only an Apache
    # reload — no copy step to forget.
    SSLCertificateFile /etc/letsencrypt/live/garageflow.studio/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/garageflow.studio/privkey.pem

    # curalis.conf sets TLS 1.3 only, globally, to satisfy HIPAA. GarageFlow is
    # not under that obligation and its DVI links get opened on whatever phone a
    # customer owns, so allow 1.2 as well — TLS 1.3 alone excludes Android 9 and
    # earlier and iOS before 12.2. Delete these two lines to inherit the strict
    # global policy instead.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLHonorCipherOrder off

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # DVI photo uploads stream through the API; don't let the proxy buffer or
    # time out a slow phone upload prematurely.
    ProxyTimeout 120

    RewriteEngine On

    # /api/* -> the Go API with the prefix stripped, matching what the dev
    # Caddyfile's `handle_path /api/*` does. The browser calls
    # https://garageflow.studio/api/auth/me, the API sees /auth/me.
    RewriteRule ^/api/(.*)$ http://gf-api:8080/$1 [P,L]
    ProxyPassReverse /api/ http://gf-api:8080/

    # Everything else -> Next.js (this includes the marketing landing at /).
    RewriteRule ^/(.*)$ http://gf-web:3000/$1 [P,L]
    ProxyPassReverse / http://gf-web:3000/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
