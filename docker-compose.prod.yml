# Production stack for garageflow.studio.
#
# Apache runs on the HOST as the reverse proxy: it terminates TLS and routes by
# Host header into this stack (see infra/apache/garageflow.conf). This stack
# ships no proxy of its own.
#
# Nothing here binds a public interface. web and api publish to 127.0.0.1 only,
# so they are reachable by host Apache and by nothing else; postgres, redis and
# minio publish no host port at all.
#
# Host ports use a dedicated 283xx block rather than the usual 3000/8080,
# because this server runs several applications and the common ports collide.
# They sit below 32768 so they cannot clash with the kernel's ephemeral range.
# Override per-host with WEB_PORT / API_PORT in .env.
#
# Secrets come from .env beside this file (chmod 600, never committed).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: gf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema only. initdb ignores subdirectories, so migrations/seed/ is not
      # applied here — production must never get the demo shop and its
      # published-password owner account. Bootstrap real accounts with:
      #   docker compose -f docker-compose.prod.yml run --rm api /createadmin ...
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: gf-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    restart: unless-stopped
    networks: [internal]

  minio:
    image: minio/minio:latest
    container_name: gf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    # Deliberately internal-only: the API streams objects to clients itself
    # (storage.Store.Get), so MinIO is never contacted by a browser and needs
    # no route through Apache.
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: gf-api
    env_file: .env
    environment:
      PORT: "8080"
      # Backends live on this stack's private network and are unreachable from
      # outside the host. Addressed by container name, which is stable and
      # unambiguous regardless of what else runs on this server.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gf-postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://gf-redis:6379/0
      MINIO_ENDPOINT: gf-minio:9000
      # AUTH_DEV_CODES is intentionally absent. Setting it would return
      # magic-link codes in API responses, which is a full auth bypass.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Loopback only. Host Apache proxies to this; nothing off-box can reach it.
    ports:
      - "127.0.0.1:${API_PORT:-28301}:8080"
    mem_limit: 256m
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        # Inlined into the bundle at build time, so it must be correct BEFORE
        # the image is built. Same-origin /api keeps the browser's requests on
        # garageflow.studio, which matters because the API's CORS allowlist is
        # localhost-only — a cross-origin api.garageflow.studio would break
        # every authenticated request.
        NEXT_PUBLIC_API_URL: https://garageflow.studio/api
    container_name: gf-web
    depends_on:
      - api
    # Loopback only. Host Apache proxies to this; nothing off-box can reach it.
    ports:
      - "127.0.0.1:${WEB_PORT:-28300}:3000"
    mem_limit: 512m
    restart: unless-stopped
    networks: [internal]

networks:
  # Private to this stack; no route in from outside the host.
  internal:

volumes:
  pgdata:
  redisdata:
  miniodata:
