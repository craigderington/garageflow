services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garageflow
      POSTGRES_PASSWORD: garageflow
      POSTGRES_DB: garageflow
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garageflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: garageflow
      MINIO_ROOT_PASSWORD: garageflow123
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://garageflow:garageflow@postgres:5432/garageflow?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=dev-secret-change-in-production
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=garageflow
      - MINIO_SECRET_KEY=garageflow123
      - MINIO_BUCKET=garageflow
    restart: always
    depends_on:
      - postgres
      - redis
      - minio

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
